<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>English Ordering Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="widget-container">
        <div id="home-view" class="view-panel">
            <div class="widget-header">
                <span>🍀ESC_SPEAKING🍀</span>
                <select id="type-filter" class="type-filter">
                    <option value="all">전체</option>
                    <option value="롤플레잉">롤플레잉</option>
                    <option value="기초회화">기초회화</option>
                    <option value="문장반복">문장반복</option>
                    <option value="대화">대화</option>
                    <option value="오픽">오픽</option>
                </select>
            </div>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
                <input id="homework-search" type="search" placeholder="제목 · 내용 검색" autocomplete="off" aria-label="숙제 제목과 내용 검색">
            </div>
            <div id="homework-list" class="list-container"></div>
            <footer class="site-footer">
                <p>이 페이지의 모든 콘텐츠는 ESC(이상한 스피킹 클럽) 운영자에게 귀속됩니다.</p>
                <a href="mailto:jisun645028@gmail.com">문의: jisun645028@gmail.com</a>
            </footer>
        </div>

        <div id="game-view" class="view-panel hidden">
            <div class="game-header">
                <button id="back-btn" class="back-btn">✕</button>
                <div class="progress" id="progress-text">1 / 10</div>
            </div>
            
            <div class="korean-text" id="korean-text">로딩 중...</div>
            <div class="selected-area" id="selected-area"></div>
            <div class="available-area" id="available-area"></div>
            
            <button class="check-btn" id="check-btn" disabled>확인</button>
        </div>

        <div id="complete-view" class="view-panel hidden">
            <div class="complete-content">
                <div class="complete-icon">🏆</div>
                <div class="complete-title">Mission Complete!</div>
                <div class="complete-homework-title" id="complete-hw-title">숙제 제목</div>
                <div class="complete-time" id="complete-time">클리어 시간</div>
                
                <div class="complete-message">
                    이 화면을 캡처해서<br>톡방에 보내어 인증해주세요 📸
                </div>
            </div>
            <button class="check-btn" id="go-home-btn">홈으로 돌아가기</button>
        </div>

        <div id="emoji-container"></div>

        <div class="modal" id="error-modal">
            <div class="modal-title">오답입니다 😢</div>
            <div class="modal-subtitle">올바른 문장</div>
            <div class="modal-correct-text" id="correct-answer-text"></div>
            <button class="modal-btn" id="retry-btn">다시 하기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
